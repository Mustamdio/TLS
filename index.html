<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khdamli - Connexion</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="card">
            <div class="card-header">
                <div class="logo">K</div>
                <h1>Khdamli</h1>
                <p>Bienvenue sur le site d'inscription et suivi de votre demande TLScontact en ligne</p>
            </div>

            <div class="alert alert-danger" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Adresse email</label>
                    <input type="email" class="form-control" id="email" placeholder="votre@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary">Se connecter</button>
            </form>

            <div class="divider">ou</div>

            <div class="text-center">
                <p>Pas encore de compte ? <a href="register.html" class="link">S'inscrire sur le site</a></p>
                <p class="mt-2"><a href="forgot-password.html" class="link">Mot de passe oublié ?</a></p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showAlert('successAlert', 'Connexion réussie ! Redirection...');
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } else {
                    showAlert('errorAlert', data.message || 'Erreur de connexion');
                }
            } catch (err) {
                showAlert('errorAlert', 'Erreur serveur');
            }
        });
    </script>
</body>
</html>
