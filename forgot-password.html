<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khdamli - Mot de passe oublié</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="card">
            <div class="card-header">
                <div class="logo">K</div>
                <h1>Mot de passe oublié</h1>
                <p>Récupérez l'accès à votre compte</p>
            </div>

            <div class="alert alert-danger" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <!-- Étape 1 : Email -->
            <div id="step1">
                <form id="emailForm">
                    <div class="form-group">
                        <label for="email">Entrez votre adresse email</label>
                        <input type="email" class="form-control" id="email" placeholder="votre@email.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Envoyer OTP</button>
                </form>
            </div>

            <!-- Étape 2 : OTP -->
            <div id="step2" class="hidden">
                <form id="otpForm">
                    <div class="form-group">
                        <label for="otp">Code OTP</label>
                        <input type="text" class="form-control" id="otp" placeholder="000000" maxlength="6" required>
                        <small style="color:#6c757d; font-size:12px;">Un code à 6 chiffres a été envoyé à votre email</small>
                    </div>
                    <button type="submit" class="btn btn-primary">Confirmer OTP</button>
                    <button type="button" class="btn btn-outline mt-2" id="resendBtn" disabled>
                        Renvoyer OTP (<span id="timer">60</span>s)
                    </button>
                </form>
            </div>

            <!-- Étape 3 : Nouveau mot de passe -->
            <div id="step3" class="hidden">
                <form id="resetForm">
                    <div class="form-group">
                        <label for="newPassword">Nouveau mot de passe</label>
                        <input type="password" class="form-control" id="newPassword" placeholder="••••••••" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirmer le mot de passe</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-success">Confirmer</button>
                </form>
            </div>

            <div class="text-center mt-3">
                <p><a href="index.html" class="link">Retour à la connexion</a></p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let currentEmail = '';
        let currentOtp = '';
        let timerInterval;

        // Étape 1 : Envoyer OTP
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            currentEmail = document.getElementById('email').value;

            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail })
                });

                const data = await res.json();

                if (res.ok) {
                    showAlert('successAlert', 'OTP envoyé ! Vérifiez votre boîte email.');
                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('step2').classList.remove('hidden');
                    startTimer();
                } else {
                    showAlert('errorAlert', data.message);
                }
            } catch (err) {
                showAlert('errorAlert', 'Erreur serveur');
            }
        });

        // Étape 2 : Vérifier OTP
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            currentOtp = document.getElementById('otp').value;

            try {
                const res = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp: currentOtp })
                });

                if (res.ok) {
                    showAlert('successAlert', 'OTP vérifié ! Créez votre nouveau mot de passe');
                    document.getElementById('step2').classList.add('hidden');
                    document.getElementById('step3').classList.remove('hidden');
                } else {
                    showAlert('errorAlert', 'OTP invalide');
                }
            } catch (err) {
                showAlert('errorAlert', 'Erreur serveur');
            }
        });

        // Étape 3 : Réinitialiser le mot de passe
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showAlert('errorAlert', 'Les mots de passe ne correspondent pas');
                return;
            }

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp: currentOtp, newPassword })
                });

                if (res.ok) {
                    showAlert('successAlert', 'Mot de passe réinitialisé ! Redirection...');
                    setTimeout(() => window.location.href = 'index.html', 2000);
                } else {
                    const data = await res.json();
                    showAlert('errorAlert', data.message);
                }
            } catch (err) {
                showAlert('errorAlert', 'Erreur serveur');
            }
        });

        // Timer pour renvoyer OTP
        function startTimer() {
            let seconds = 60;
            const timerSpan = document.getElementById('timer');
            const resendBtn = document.getElementById('resendBtn');
            
            resendBtn.disabled = true;
            
            timerInterval = setInterval(() => {
                seconds--;
                timerSpan.textContent = seconds;
                
                if (seconds <= 0) {
                    clearInterval(timerInterval);
                    resendBtn.disabled = false;
                    resendBtn.innerHTML = 'Renvoyer OTP';
                }
            }, 1000);
        }

        document.getElementById('resendBtn').addEventListener('click', async () => {
            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail })
                });
                
                const data = await res.json();
                if (res.ok) {
                    showAlert('successAlert', 'Nouvel OTP envoyé ! Vérifiez votre email.');
                    startTimer();
                }
            } catch (err) {
                showAlert('errorAlert', 'Erreur lors du renvoi');
            }
        });
    </script>
</body>
</html>
